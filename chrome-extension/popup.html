<!DOCTYPE html>
<html>

<head>
    <title>Eye Distance Monitor</title>
    <style>
        body {
            width: 300px;
            padding: 20px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            margin: 0;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        h1 {
            font-size: 1.2rem;
            margin: 0;
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status-card {
            background: #1e293b;
            padding: 15px;
            border-radius: 12px;
            width: 100%;
            text-align: center;
            border: 1px solid #334155;
        }

        .distance {
            font-size: 2.5rem;
            font-weight: bold;
            margin: 10px 0;
            color: #22c55e;
        }

        .warning {
            color: #ef4444 !important;
        }

        button {
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
            width: 100%;
        }

        button:hover {
            opacity: 0.9;
            transform: scale(1.02);
        }

        button:active {
            transform: scale(0.98);
        }

        #video-container {
            width: 100%;
            border-radius: 8px;
            overflow: hidden;
            display: none;
            position: relative;
        }

        video {
            width: 100%;
            transform: scaleX(-1);
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform: scaleX(-1);
        }

        .settings-link {
            font-size: 0.8rem;
            color: #94a3b8;
            cursor: pointer;
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Eye Distance Monitor</h1>
        <div class="status-card">
            <div id="status-text">Monitoring Paused</div>
            <div id="distance-readout" class="distance">-- cm</div>
            <div id="alert-text"></div>
        </div>
        <div id="video-container">
            <video id="webcam" autoplay playsinline></video>
            <canvas id="output_canvas"></canvas>
        </div>
        <button id="toggle-btn">Start Monitoring</button>

        <div class="privacy-note"
            style="font-size: 0.75rem; margin-top: 15px; color: #64748b; text-align: center; line-height: 1.4;">
            <svg style="width:12px; height:12px; vertical-align: middle; margin-right: 4px;" viewBox="0 0 24 24"
                fill="currentColor">
                <path
                    d="M12,1L3,5V11C3,16.55 6.84,21.74 12,23C17.16,21.74 21,16.55 21,11V5L12,1M12,11.91V19.15C12,19.26 11.97,19.36 11.92,19.46C11.85,19.57 11.77,19.67 11.66,19.74C11.41,19.9 11.08,19.9 10.83,19.74C10.72,19.67 10.64,19.57 10.57,19.46C10.52,19.36 10.5,19.26 10.5,19.15V11.91C9.6,11.58 9,10.68 9,9.5A3,3 0 0,1 12,6.5A3,3 0 0,1 15,9.5C15,10.68 14.4,11.58 13.5,11.91V12.5H12V11.91Z" />
            </svg>
            <strong>Privacy Guaranteed:</strong> All processing is done locally. No data ever leaves your device.
        </div>
        <div class="settings-link" style="margin-top: 10px;">Calibration Settings</div>
    </div>
    <!-- Load MediaPipe Tasks Vision -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0"></script>
    <script src="popup.js" type="module"></script>
</body>

</html>
