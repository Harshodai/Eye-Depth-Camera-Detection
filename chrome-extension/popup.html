<!DOCTYPE html>
<html>

<head>
    <title>EyeVision Guard</title>
    <style>
        :root {
            --bg-dark: #020617;
            --card-parent: #0f172a;
            --primary: #38bdf8;
            --secondary: #818cf8;
            --accent-green: #10b981;
            --accent-red: #f43f5e;
            --text-main: #f8fafc;
            --text-dim: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            width: 300px;
            font-family: 'Inter', -apple-system, system-ui, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            overflow: hidden;
        }

        .app-container {
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .logo {
            width: 20px;
            height: 20px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo svg {
            width: 12px;
            height: 12px;
            fill: white;
        }

        h1 {
            font-size: 0.85rem;
            font-weight: 700;
            color: #fff;
        }

        .privacy-banner {
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.55rem;
            color: #4ade80;
            display: flex;
            align-items: center;
            gap: 3px;
            margin-bottom: 2px;
            opacity: 0.8;
            width: fit-content;
        }

        .privacy-banner svg {
            width: 10px;
            height: 10px;
            fill: currentColor;
        }

        .monitor-display {
            position: relative;
            height: 110px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: var(--card-parent);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .distance-value {
            font-size: 3.2rem;
            font-weight: 800;
            line-height: 1;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            text-shadow: 0 0 20px rgba(56, 189, 248, 0.1);
        }

        .active-safe .distance-value {
            color: #4ade80;
            text-shadow: 0 0 25px rgba(74, 222, 128, 0.3);
        }

        .distance-unit {
            font-size: 0.6rem;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-top: 2px;
        }

        .status-badge {
            position: absolute;
            top: 8px;
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 2px 8px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            font-size: 0.55rem;
            font-weight: 600;
            color: var(--text-dim);
        }

        .dot {
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: #475569;
        }

        .active .dot {
            background: #10b981;
            box-shadow: 0 0 5px #10b981;
        }

        .is-warning .dot {
            background: var(--accent-red);
            animation: blink 0.8s infinite;
        }

        .is-warning .distance-value {
            color: var(--accent-red);
        }

        @keyframes blink {
            0% {
                opacity: 1;
            }

            50% {
                opacity: 0.2;
            }

            100% {
                opacity: 1;
            }
        }

        /* Compact Horizontal Slider */
        .settings-card {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
            padding: 8px 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .slider-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .slider-label {
            font-size: 0.65rem;
            font-weight: 600;
            color: var(--text-dim);
        }

        .timer-val-wrap {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--primary);
        }

        .horizontal-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            outline: none;
        }

        .horizontal-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--primary);
            cursor: pointer;
            box-shadow: 0 0 8px rgba(56, 189, 248, 0.3);
            border: 2px solid var(--bg-dark);
            transition: transform 0.1s;
        }

        @keyframes heartbeat {
            0% {
                transform: scale(1);
                opacity: 0.1;
            }

            50% {
                transform: scale(1.05);
                opacity: 0.2;
            }

            100% {
                transform: scale(1);
                opacity: 0.1;
            }
        }

        .monitor-display::before {
            content: '';
            position: absolute;
            width: 150%;
            height: 150%;
            background: radial-gradient(circle, var(--primary) 0%, transparent 70%);
            opacity: 0;
            transition: opacity 0.5s;
            pointer-events: none;
            z-index: 0;
        }

        .monitor-display.active-safe::before {
            opacity: 0.08;
            animation: heartbeat 3s infinite ease-in-out;
        }

        #toggle-btn:hover {
            transform: translateY(-1px);
            filter: brightness(1.1);
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.3);
        }

        #toggle-btn:active {
            transform: translateY(0);
        }

        #toggle-btn {
            height: 40px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            transition: 0.2s;
        }

        #toggle-btn.active {
            background: rgba(244, 63, 94, 0.1);
            color: #f43f5e;
            border: 1px solid rgba(244, 63, 94, 0.2);
        }

        .footer {
            font-size: 0.55rem;
            color: var(--text-dim);
            text-align: center;
            opacity: 0.6;
        }

        #video-container {
            display: none;
        }
    </style>
</head>

<body>
    <div class="app-container">
        <div class="header">
            <div class="brand">
                <div class="logo">
                    <svg viewBox="0 0 24 24">
                        <path
                            d="M12,9A3,3 0 0,0 9,12A3,3 0 0,0 12,15A3,3 0 0,0 15,12A3,3 0 0,0 12,9M12,17A5,5 0 0,1 7,12A5,5 0 0,1 12,7A5,5 0 0,1 17,12A5,5 0 0,1 12,17M12,4.5C7,4.5 2.73,7.61 1,12C2.73,16.39 7,19.5 12,19.5C17,19.5 21.27,16.39 23,12C21.27,7.61 17,4.5 12,4.5Z" />
                    </svg>
                </div>
                <h1>EyeVision Guard</h1>
            </div>
            <div class="privacy-banner">
                <svg viewBox="0 0 24 24">
                    <path
                        d="M12,12A3,3 0 1,0 12,6A3,3 0 1,0 12,12M12,2C6.48,2 2,6.48 2,12s4.48,10 10,10 10-4.48 10-10S17.52,2 12,2zm0 18c-4.41,0-8-3.59-8-8s3.59-8 8-8 8,3.59 8,8-3.59 8-8 8z" />
                </svg>
                <span>No Data is Stored anywhere</span>
            </div>
        </div>

        <div id="monitor-card" class="monitor-display">
            <div id="status-badge" class="status-badge">
                <span class="dot"></span>
                <span id="status-text">IDLE</span>
            </div>
            <div id="distance-readout" class="distance-value">--</div>
            <div id="distance-unit" class="distance-unit">Monitoring</div>
        </div>

        <div class="settings-card">
            <div class="slider-header">
                <span class="slider-label">Alert Delay</span>
                <span class="timer-val-wrap"><span id="slider-val">5</span>s</span>
            </div>
            <input type="range" id="alert-slider" class="horizontal-slider" min="5" max="15" value="5" step="1">
        </div>

        <!-- 20-20-20 Break Reminder Section -->
        <div class="settings-card" style="margin-top: 5px;">
            <div class="slider-header">
                <span class="slider-label" style="color: #38bdf8;">20-20-20 Break Reminder</span>
                <label class="switch">
                    <input type="checkbox" id="break-toggle" checked>
                    <span class="slider round"></span>
                </label>
            </div>

            <div id="break-settings" style="display: flex; flex-direction: column; gap: 12px; margin-top: 12px;">
                <!-- Interval Slider -->
                <div class="setting-slider-group">
                    <div class="slider-header-sub">
                        <span class="sub-label">Interval (mins)</span>
                        <span class="sub-val" id="val-interval">20</span>
                    </div>
                    <input type="range" id="break-interval" class="horizontal-slider sub-slider" min="20" max="30"
                        value="20" step="1">
                </div>

                <!-- Duration Slider -->
                <div class="setting-slider-group">
                    <div class="slider-header-sub">
                        <span class="sub-label">Duration (secs)</span>
                        <span class="sub-val" id="val-duration">20</span>
                    </div>
                    <input type="range" id="break-duration" class="horizontal-slider sub-slider" min="20" max="30"
                        value="20" step="1">
                </div>

                <!-- Modern Toggle Cards for Notify / Blink -->
                <div class="toggle-group">
                    <input type="checkbox" id="check-notify" class="hidden-check" checked>
                    <label for="check-notify" class="toggle-card">
                        <div class="icon-box">
                            <svg viewBox="0 0 24 24">
                                <path
                                    d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.63-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.64 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2zm-2 1H8v-6c0-2.48 1.51-4.5 4-4.5s4 2.02 4 4.5v6z" />
                            </svg>
                        </div>
                        <span>Notify</span>
                    </label>

                    <input type="checkbox" id="check-blink" class="hidden-check" checked>
                    <label for="check-blink" class="toggle-card">
                        <div class="icon-box">
                            <svg viewBox="0 0 24 24">
                                <path
                                    d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z" />
                            </svg>
                        </div>
                        <span>Blink</span>
                    </label>
                </div>

                <div class="countdown-text" id="break-countdown">Next break: --:--</div>
            </div>
        </div>

        <style>
            .setting-slider-group {
                display: flex;
                flex-direction: column;
                gap: 4px;
            }

            .slider-header-sub {
                display: flex;
                justify-content: space-between;
                align-items: center;
            }

            .sub-label {
                font-size: 0.6rem;
                color: var(--text-dim);
            }

            .sub-val {
                font-size: 0.7rem;
                font-weight: 700;
                color: var(--secondary);
            }

            .sub-slider {
                height: 3px;
                background: rgba(255, 255, 255, 0.05);
            }

            .sub-slider::-webkit-slider-thumb {
                width: 10px;
                height: 10px;
                border-width: 1px;
            }

            /* HIDE OLD CHECKBOXES */
            .hidden-check {
                display: none;
            }

            .toggle-group {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 10px;
                margin-top: 8px;
            }

            .toggle-card {
                background: rgba(255, 255, 255, 0.03);
                border: 1px solid rgba(255, 255, 255, 0.05);
                border-radius: 8px;
                padding: 10px;
                display: flex;
                flex-direction: row;
                align-items: center;
                justify-content: center;
                gap: 8px;
                cursor: pointer;
                transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
                position: relative;
                overflow: hidden;
            }

            .toggle-card:hover {
                background: rgba(255, 255, 255, 0.06);
                transform: translateY(-1px);
            }

            /* ICONS */
            .icon-box svg {
                width: 16px;
                height: 16px;
                fill: var(--text-dim);
                transition: fill 0.2s;
            }

            .toggle-card span {
                font-size: 0.7rem;
                font-weight: 600;
                color: var(--text-dim);
                transition: color 0.2s;
            }

            /* CHECKED STATE */
            .hidden-check:checked+.toggle-card {
                background: rgba(56, 189, 248, 0.1);
                border-color: rgba(56, 189, 248, 0.4);
                box-shadow: 0 0 10px rgba(56, 189, 248, 0.1) inset;
            }

            .hidden-check:checked+.toggle-card .icon-box svg {
                fill: #38bdf8;
            }

            .hidden-check:checked+.toggle-card span {
                color: #f8fafc;
            }

            /* ANIMATED BORDER GLOW */
            .hidden-check:checked+.toggle-card::before {
                content: '';
                position: absolute;
                top: 0;
                left: 0;
                width: 3px;
                height: 100%;
                background: var(--primary);
                opacity: 0.8;
            }

            .countdown-text {
                font-size: 0.65rem;
                color: var(--accent-green);
                text-align: center;
                margin-top: 5px;
                font-family: monospace;
                background: rgba(16, 185, 129, 0.1);
                padding: 4px;
                border-radius: 4px;
            }

            /* Toggle Switch */
            .switch {
                position: relative;
                display: inline-block;
                width: 28px;
                height: 16px;
            }

            .switch input {
                opacity: 0;
                width: 0;
                height: 0;
            }

            .slider.round {
                position: absolute;
                cursor: pointer;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                background-color: #334155;
                transition: .4s;
                border-radius: 16px;
            }

            .slider.round:before {
                position: absolute;
                content: "";
                height: 12px;
                width: 12px;
                left: 2px;
                bottom: 2px;
                background-color: white;
                transition: .4s;
                border-radius: 50%;
            }

            input:checked+.slider.round {
                background-color: var(--primary);
            }

            input:checked+.slider.round:before {
                transform: translateX(12px);
            }
        </style>

        <button id="toggle-btn">Start Protection</button>

        <div class="footer">
            Private Neural Vision Guard
        </div>

        <div id="video-container">
            <video id="webcam" autoplay playsinline></video>
        </div>
    </div>
    <script src="popup.js"></script>
</body>

</html>
