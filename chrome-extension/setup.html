<!DOCTYPE html>
<html>

<head>
    <title>Vision Guard - Initial Setup</title>
    <style>
        :root {
            --bg: #020617;
            --primary: #38bdf8;
            --secondary: #818cf8;
        }

        body {
            background: var(--bg);
            color: white;
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: rgba(15, 23, 42, 0.8);
            padding: 40px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            max-width: 500px;
            text-align: center;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 16px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            color: #94a3b8;
            line-height: 1.6;
            margin-bottom: 32px;
        }

        .preview-box {
            width: 100%;
            aspect-ratio: 4/3;
            background: #000;
            border-radius: 16px;
            margin-bottom: 24px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
            display: none;
        }

        .placeholder-text {
            color: #475569;
            font-size: 0.9rem;
        }

        #grant-btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s;
        }

        #grant-btn:hover {
            filter: contrast(1.1);
            transform: translateY(-2px);
        }

        .privacy-seal {
            margin-top: 24px;
            font-size: 0.8rem;
            color: #10b981;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Welcome to Vision Guard</h1>
        <p>To start monitoring your eye distance, we need a one-time camera permission. All processing stays local on
            your CPU/GPU.</p>

        <div class="preview-box">
            <video id="test-video" autoplay playsinline></video>
            <div id="placeholder" class="placeholder-text">Camera preview will appear here</div>
        </div>

        <button id="grant-btn">Allow Camera Access</button>

        <div class="privacy-seal">
            <svg width="14" height="14" fill="currentColor" viewBox="0 0 24 24">
                <path d="M12,1L3,5V11C3,16.55 6.84,21.74 12,23C17.16,21.74 21,16.55 21,11V5L12,1Z" />
            </svg>
            <span>Verified Local-Only Processing</span>
        </div>
    </div>

    <script src="setup.js"></script>
</body>

</html>
