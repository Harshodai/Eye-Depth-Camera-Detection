<!DOCTYPE html>
<html>

<head>
    <title>EyeVision Guard</title>
    <style>
        :root {
            --bg-dark: #020617;
            --card-parent: #0f172a;
            --primary: #38bdf8;
            --secondary: #818cf8;
            --accent-green: #10b981;
            --accent-red: #f43f5e;
            --text-main: #f8fafc;
            --text-dim: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            width: 300px;
            font-family: 'Inter', -apple-system, system-ui, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            overflow: hidden;
        }

        .app-container {
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo {
            width: 22px;
            height: 22px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo svg {
            width: 14px;
            height: 14px;
            fill: white;
        }

        h1 {
            font-size: 0.9rem;
            font-weight: 700;
            color: #fff;
        }

        .privacy-banner {
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.55rem;
            color: #4ade80;
            display: flex;
            align-items: center;
            gap: 3px;
            margin-bottom: 2px;
            opacity: 0.8;
            width: fit-content;
        }

        .privacy-banner svg {
            min-width: 12px;
            width: 12px;
            height: 12px;
            fill: currentColor;
        }

        .monitor-display {
            position: relative;
            height: 120px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: var(--card-parent);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .distance-value {
            font-size: 3.5rem;
            font-weight: 800;
            line-height: 1;
            transition: all 0.3s;
        }

        .distance-unit {
            font-size: 0.65rem;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-top: 4px;
        }

        .status-badge {
            position: absolute;
            top: 10px;
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 2px 8px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            font-size: 0.6rem;
            font-weight: 600;
            color: var(--text-dim);
        }

        .dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: #475569;
        }

        .active .dot {
            background: #10b981;
            box-shadow: 0 0 5px #10b981;
        }

        .is-warning .dot {
            background: var(--accent-red);
            animation: blink 0.8s infinite;
        }

        .is-warning .distance-value {
            color: var(--accent-red);
            transform: scale(1.1);
        }

        @keyframes blink {
            0% {
                opacity: 1;
            }

            50% {
                opacity: 0.2;
            }

            100% {
                opacity: 1;
            }
        }

        #toggle-btn {
            height: 44px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 8px;
        }

        #toggle-btn:hover {
            filter: contrast(1.1) brightness(1.1);
        }

        #toggle-btn.active {
            background: rgba(244, 63, 94, 0.1);
            color: #f43f5e;
            border: 1px solid rgba(244, 63, 94, 0.2);
        }

        .footer {
            font-size: 0.6rem;
            color: var(--text-dim);
            text-align: center;
            opacity: 0.8;
            margin-top: 4px;
        }

        #video-container {
            display: none;
        }
    </style>
</head>

<body>
    <div class="app-container">
        <div class="header">
            <div class="brand">
                <div class="logo">
                    <svg viewBox="0 0 24 24">
                        <path
                            d="M12,9A3,3 0 0,0 9,12A3,3 0 0,0 12,15A3,3 0 0,0 15,12A3,3 0 0,0 12,9M12,17A5,5 0 0,1 7,12A5,5 0 0,1 12,7A5,5 0 0,1 17,12A5,5 0 0,1 12,17M12,4.5C7,4.5 2.73,7.61 1,12C2.73,16.39 7,19.5 12,19.5C17,19.5 21.27,16.39 23,12C21.27,7.61 17,4.5 12,4.5Z" />
                    </svg>
                </div>
                <h1>EyeVision Guard</h1>
            </div>
        </div>

        <div class="privacy-banner">
            <svg viewBox="0 0 24 24">
                <path
                    d="M12,12A3,3 0 1,0 12,6A3,3 0 1,0 12,12M12,2C6.48,2 2,6.48 2,12s4.48,10 10,10 10-4.48 10-10S17.52,2 12,2zm0 18c-4.41,0-8-3.59-8-8s3.59-8 8-8 8,3.59 8,8-3.59 8-8 8z" />
            </svg>
            <span>Privacy: Locally processed, no data stored.</span>
        </div>

        <div id="monitor-card" class="monitor-display">
            <div id="status-badge" class="status-badge">
                <span class="dot"></span>
                <span id="status-text">System IDLE</span>
            </div>
            <div id="distance-readout" class="distance-value">--</div>
            <div id="distance-unit" class="distance-unit">Monitoring</div>
        </div>

        <button id="toggle-btn">Start Protection</button>

        <div class="footer">
            Designed for Local Neural Processing
        </div>

        <div id="video-container">
            <video id="webcam" autoplay playsinline></video>
        </div>
    </div>
    <script src="popup.js"></script>
</body>

</html>
