<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Regression Suite</title>
    <style>
        body {
            background: #0f172a;
            color: #f8fafc;
            font-family: sans-serif;
            padding: 20px;
        }

        h1 {
            color: #38bdf8;
        }

        .pass {
            color: #4ade80;
        }

        .fail {
            color: #f87171;
        }

        .test-item {
            margin: 8px 0;
            font-family: monospace;
        }

        /* Mock UI elements for break.js */
        #ui-mocks {
            display: none;
        }
    </style>
</head>

<body>
    <h1>EyeVision Guard Regression Suite</h1>
    <div id="summary">Running tests...</div>
    <ul id="test-list"></ul>

    <!-- Mock UI -->
    <div id="ui-mocks">
        <div id="countdown"></div>
        <svg>
            <circle id="progress-circle"></circle>
        </svg>
        <button id="close-btn"></button>
        <video id="webcam" style="display:none"></video>
        <div id="logs"
            style="white-space: pre-wrap; font-family: monospace; color: #aaa; margin-top: 20px; border-top: 1px solid #333; padding-top: 10px;">
        </div>
    </div>

    <!-- Mocks Setup -->
    <script>
        window.__TEST_MODE__ = true;

        // Simple Mock Spy Factory
        const jest = {
            fn: (impl) => {
                const spy = (...args) => {
                    spy.mock.calls.push(args);
                    return impl ? impl(...args) : undefined;
                };
                spy.mock = { calls: [] };
                spy.mockClear = () => { spy.mock.calls = []; };
                spy.mockImplementation = (newImpl) => { impl = newImpl; };
                return spy;
            }
        };

        // Chrome API Mocks
        window.chrome = {
            runtime: {
                onMessage: { addListener: jest.fn() },
                onInstalled: { addListener: jest.fn() },
                sendMessage: jest.fn(),
                getURL: (path) => path,
                lastError: null
            },
            storage: {
                local: {
                    get: jest.fn((keys, cb) => cb({})),
                    set: jest.fn(),
                    remove: jest.fn()
                }
            },
            alarms: {
                onAlarm: { addListener: jest.fn() },
                create: jest.fn(),
                clear: jest.fn(),
                get: jest.fn()
            },
            windows: {
                onRemoved: { addListener: jest.fn() },
                getLastFocused: jest.fn(),
                update: jest.fn()
            },
            tabs: {
                query: jest.fn(),
                remove: jest.fn()
            },
            notifications: {
                create: jest.fn(),
                onClicked: { addListener: jest.fn() },
                onButtonClicked: { addListener: jest.fn() }
            },
            offscreen: {
                createDocument: jest.fn(),
                closeDocument: jest.fn()
            },
            action: {
                setBadgeText: jest.fn(),
                setBadgeBackgroundColor: jest.fn()
            }
        };
    </script>

    <!-- Load Test Framework -->
    <script src="framework.js"></script>

    <!-- Load Source Files (Modules will expose to EyeGuard global) -->
    <script src="../break.js"></script>
    <script src="../background.js"></script>
    <script src="../offscreen.js"></script>

    <!-- Load Specs -->
    <script src="spec_break.js"></script>
    <script src="spec_background.js"></script>
    <script src="spec_offscreen.js"></script>

    <!-- Run -->
    <script>
        // Redirect console to #logs
        const logDiv = document.getElementById('logs');
        const makeLogger = (type) => (...args) => {
             const line = document.createElement('div');
             line.textContent = `[${type}] ${args.map(a => typeof a === 'object' ? JSON.stringify(a) : String(a)).join(' ')}`;
             line.style.color = type === 'error' ? '#f87171' : '#aaa';
             logDiv.appendChild(line);
             // Also call original? Maybe not to avoid noise in browser tool output if I capture DOM.
        };
        // window.console.log = makeLogger('LOG');
        // window.console.error = makeLogger('ERROR'); 
        // We need to override the window consle BEFORE offscreen loads? No, offscreen saves original.
        // Offscreen saves originalLog = console.log.
        // So we should see if we can hook into offscreen's logging or just use the browser tool to capture console?
        // Actually browser tool doesn't capture console. It captures DOM.
        // So I must redirect.
        // But offscreen.js saves originalLog early.
        // So I need to put this script BEFORE offscreen.js script tag.
        
        // I will just add this to the END for now, which captures logs from TESTS (which use window.console).
        // Offscreen uses 'originalLog' which is the REAL console.
        // BUT offscreen.js says: console.log = ... filter ... originalLog.
        // If I override console.log check this out:
        // const originalLog = console.log; (In offscreen.js)
        // If I override it BEFORE offscreen.js, originalLog becomes my logger.
        // YES.
    </script>
    <script>
        window.onload = runTests;
    </script>
</body>
</html>
